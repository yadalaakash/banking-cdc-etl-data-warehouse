# Render Infrastructure-as-Code Blueprint
# Banking CDC-ETL Data Warehouse System

services:
  # 1. Backend Web Service (Python / FastAPI)
  - type: web
    name: banking-cdc-etl-data-warehouse
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_ANOMALY_DETECTION
        value: "true"
      - key: SCD_MODE
        value: scd_type_2

  # 2. Frontend Static Site (React 19 / Vite 8)
  - type: static_site
    name: banking-cdc-etl-data-warehouse-ui
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://banking-cdc-etl-data-warehouse.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
